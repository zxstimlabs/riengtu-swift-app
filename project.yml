name: Riengtu

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # English is the source language. Every string is also in Vietnamese, in App/Localizable.xcstrings.
  developmentLanguage: en

settings:
  base:
    # Single source of truth for IDs.
    APP_BUNDLE_ID: vn.riengtu
    # Pyhash LLC, the same team as ETHnym and Figbear.
    DEVELOPMENT_TEAM: 8G6DC3A5B8
    # Xcode registers the bundle ID and makes the profiles it needs.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "13"

packages:
  RiengtuKit:
    path: Packages/RiengtuKit

targets:
  Riengtu:
    type: application
    # iPhone and iPad for now. Adding macOS here gives the same target a native Mac build, as in
    # Figbear and ETHnym.
    supportedDestinations: [iOS]
    sources: [App]
    dependencies:
      - package: RiengtuKit
    # iCloud sync (CloudSync), in the person's private database, and the pushes that tell it about
    # other devices' changes. The container is made the first time a signed build needs it, and
    # can't be deleted, so don't rename it.
    # Reading the inbox goes on in the background, as a continued processing task
    # (BackgroundReading), which iOS 26 allows for work the person started.
    info:
      path: App/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - vn.riengtu.reading
        # From the build settings, not XcodeGen's defaults.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: App/Riengtu.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.vn.riengtu
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Riengtu
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        # No iPad app in a window on the Mac. A Mac app would be its own build.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Text in code goes to the string catalog, which compiles into each language.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # UI code runs on the main actor unless it opts out.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: YES
        # The name under the icon, and on its page in Settings.
        INFOPLIST_KEY_CFBundleDisplayName: Riêng Tư
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Every orientation on the iPad, which multitasking needs.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Apple Intelligence's model needs iOS 26. Linked weakly, so the app still opens on iOS 18.
        OTHER_LDFLAGS: -weak_framework FoundationModels
        # Translated in App/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Riengtu uses Face ID to keep your spending and assets private.
    scheme:
      testTargets:
        - package: RiengtuKit/RiengtuKitTests

  # Runs the Shortcuts actions through the system. Apple's AppIntentsTesting needs iOS 27.2, so
  # these have their own scheme, apart from the tests that run on any simulator.
  RiengtuIntentTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources: [IntentTests]
    dependencies:
      - target: Riengtu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.riengtu.IntentTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Riengtu

schemes:
  RiengtuIntentTests:
    build:
      targets:
        Riengtu: all
        RiengtuIntentTests: [test]
    test:
      targets: [RiengtuIntentTests]
